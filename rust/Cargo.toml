[workspace]
resolver = "2"
members = ["crates/pb-nn", "crates/pb-core", "crates/pb-cli", "crates/pb-ffi", "crates/pb-server"]

[workspace.package]
version = "5.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false

[profile.dev]
opt-level = 2

name: Release iOS IPA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & publish iOS release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing PixelBoost version: $VERSION (tag: $TAG)"

      - name: Stamp version into project.yml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          grep MARKETING_VERSION project.yml

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep '^Xcode' | sort -rV | head -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          echo "Selected Xcode: $XCODE"
          xcodebuild -version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-ios-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-ios-

      - name: Build Rust engine (PixelBoostCore.xcframework)
        run: |
          rustup default stable
          scripts/build-core.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # No signing secrets configured for this repo yet — always produces an
      # unsigned IPA (installable with Sideloadly/AltStore, same as
      # Lumisound's unsigned path). Add IOS_CERTIFICATE_BASE64 /
      # IOS_CERTIFICATE_PASSWORD / IOS_PROVISION_PROFILE_BASE64 / IOS_TEAM_ID
      # repo secrets and port Lumisound's release-ios.yml signing step here
      # if ad-hoc signing is ever needed.
      - name: Archive (unsigned)
        env:
          # Injected as a build setting (-> Info.plist's UpscalerBridgeAPIKey
          # via $(UPSCALER_BRIDGE_API_KEY) substitution, see project.yml) —
          # never written to a file in the repo, only passed on this
          # command line from the encrypted repo secret.
          UPSCALER_BRIDGE_API_KEY: ${{ secrets.UPSCALER_BRIDGE_API_KEY }}
        run: |
          mkdir -p build
          xcodebuild archive \
            -project PixelBoost.xcodeproj \
            -scheme PixelBoost \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PixelBoost.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            "UPSCALER_BRIDGE_API_KEY=$UPSCALER_BRIDGE_API_KEY" 2>&1 | tee /tmp/xcodebuild.log | tail -20
          if grep -q "error:" /tmp/xcodebuild.log; then
            echo "--- Compiler errors ---"
            grep "error:" /tmp/xcodebuild.log | head -30
          fi
          APP=$(find build/PixelBoost.xcarchive -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Archive did not produce a .app bundle"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Bundle the Rust engine's models
        run: |
          # The resources phase doesn't run for this project in CI (same
          # reason actool is run by hand below), so copy the .pbnn models
          # into the app explicitly and fail loudly if they're missing.
          rm -rf "$APP_PATH/pbnn"
          cp -R Models/pbnn "$APP_PATH/pbnn"
          ls -la "$APP_PATH/pbnn"
          test -f "$APP_PATH/pbnn/fast-x4.pbnn"

      - name: Compile asset catalogs (actool)
        run: |
          APP="$APP_PATH"
          xcrun actool \
            --output-format human-readable-text \
            --notices \
            --warnings \
            --platform iphoneos \
            --minimum-deployment-target 17.0 \
            --target-device iphone \
            --target-device ipad \
            --app-icon AppIcon \
            --output-partial-info-plist /tmp/assetcatalog_output.plist \
            --compress-pngs \
            --compile "$APP" \
            "PixelBoost/Resources/Assets.xcassets"
          echo "Assets.car: $(du -sh "$APP/Assets.car" 2>/dev/null || echo MISSING)"

          # actool only writes the CFBundleIcons keys to this partial plist —
          # it does NOT touch the app's own Info.plist. Without merging it in,
          # Assets.car has the icon image but nothing tells iOS to actually
          # use it as the home-screen icon, so Springboard shows a blank/
          # generic icon after install even though the icon is bundled fine.
          /usr/libexec/PlistBuddy -c "Merge /tmp/assetcatalog_output.plist" "$APP/Info.plist"
          echo "CFBundleIcons: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP/Info.plist" 2>&1)"

      # SideStore, AltStore, Sideloadly and other re-signing tools copy App
      # Groups from the entitlements in the IPA's signature. An unsigned build
      # has none, so the re-signed app and its extensions get no App Group and
      # widgets/extensions can't share data with the app. Ad-hoc sign (no
      # certificate needed) with only the App Group, so free Apple IDs, which
      # can't use most other entitlements, still install it.
      - name: Embed App Group entitlement
        run: |
          APP="$APP_PATH"
          ENT=/tmp/sideload-app-groups.entitlements
          cat > "$ENT" << 'ENT_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.com.pixelboost.shared</string>
              </array>
          </dict>
          </plist>
          ENT_EOF
          # Inner code first: frameworks/dylibs plain, extensions and app with the group.
          find "$APP" \( -name '*.framework' -o -name '*.dylib' \) -prune -print | while read -r f; do
            codesign -f -s - "$f"
          done
          find "$APP" -name '*.appex' -prune -print | while read -r ext; do
            codesign -f -s - --entitlements "$ENT" "$ext"
          done
          codesign -f -s - --entitlements "$ENT" "$APP"
          for b in "$APP" "$APP"/PlugIns/*.appex; do
            [ -e "$b" ] || continue
            codesign -d --entitlements :- "$b" 2>/dev/null | grep -q "group.com.pixelboost.shared" \
              || { echo "App Group missing from $b"; exit 1; }
          done
          echo "App Group embedded in app and extensions"

      - name: Package IPA
        id: ipa
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IPA_NAME="PixelBoost-${VERSION}-unsigned.ipa"
          PAYLOAD_DIR="build/Payload/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/Payload
          zip -r "../$IPA_NAME" Payload/ -x "*.DS_Store"
          echo "IPA created: $(du -sh ../$IPA_NAME)"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=build/$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          IPA_NAME="${{ steps.ipa.outputs.ipa_name }}"

          RELEASE_NOTES=$(cat <<EOF
          ## PixelBoost v${VERSION}

          Unsigned IPA — install with [Sideloadly](https://sideloadly.io/) or [AltStore](https://altstore.io/).

          Bundles a converted Real-ESRGAN x4plus Core ML model (BSD-3-Clause) — see Models/README.md. Compiles clean in CI; actual on-device inference has not yet been verified — please test and report back.
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating metadata and uploading the IPA."
            gh release edit "$TAG" \
              --title "PixelBoost v${VERSION}" \
              --notes "$RELEASE_NOTES"
            gh release upload "$TAG" "build/$IPA_NAME" --clobber
          else
            echo "Creating release $TAG for the first time."
            gh release create "$TAG" \
              --title "PixelBoost v${VERSION}" \
              --notes "$RELEASE_NOTES" \
              "build/$IPA_NAME"
          fi

      # Best-effort: never fail the release over this housekeeping commit.
      - name: Commit stamped version back to main
        continue-on-error: true
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add project.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump MARKETING_VERSION to ${{ steps.version.outputs.version }} [skip ci]"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
